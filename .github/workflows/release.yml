name: Release

# Push a tag like v0.1.0 to build installers for macOS, Linux and Windows
# and attach them to a draft GitHub release. Check the draft, then publish
# it by hand. "Run workflow" builds the same installers without a tag, as
# workflow artifacts, to check a build before tagging.
#
# Releases also carry signed update files and latest.json, which installed
# apps read to update themselves (tauri.release.conf.json turns them on).
# The signing key is the TAURI_SIGNING_PRIVATE_KEY secret (and its
# password); the public half is in tauri.conf.json.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav
          # ^ bundled into the AppImage (bundleMediaFramework) so its WebKit
          #   can play video backgrounds.

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Build and attach to the draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: CellPresenter ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your computer below. The apps are not signed yet, so your computer will warn the first time you open one; the [README](https://github.com/thisisnich/cellpresenter#install) explains how to open it anyway.

            - **Mac (Apple Silicon, M1 and later):** `CellPresenter_*_aarch64.dmg`
            - **Mac (Intel):** `CellPresenter_*_x64.dmg`
            - **Windows:** `CellPresenter_*_x64-setup.exe` (or the `.msi`)
            - **Linux:** `.AppImage` (any distro), `.deb` (Ubuntu, Debian) or `.rpm` (Fedora)
          releaseDraft: true
          # Installed apps look for updates in the latest release, which
          # GitHub never counts a pre-release as.
          prerelease: false
          updaterJsonPreferNsis: true

      - name: Build only (no tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }} --config src-tauri/tauri.release.conf.json

      # linuxdeploy copies Ubuntu 22.04's libwayland into the AppImage, and
      # that copy is too old for newer graphics drivers. WebKit then aborts
      # ("Could not create default EGL display", seen on Fedora 44). Deb and
      # rpm packages already use the system copy. Tauri 2.11 cannot pass
      # linuxdeploy's --exclude-library flag, so the AppImage is repacked.
      - name: Use the system's Wayland libraries in the AppImage
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          image=$(readlink -f "$(ls src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage | head -1)")
          work=$(mktemp -d)
          cd "$work"
          "$image" --appimage-extract >/dev/null
          mapfile -t removed < <(find squashfs-root -name 'libwayland*.so*' -print -delete)
          if [ "${#removed[@]}" -eq 0 ]; then
            echo "No bundled libwayland libraries; leaving the AppImage as built"
            exit 0
          fi
          printf 'removed %s\n' "${removed[@]}"
          curl -fsSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$work/repacked.AppImage"
          mv "$work/repacked.AppImage" "$image"
          rm -f "${image}.sig"
          cd "$GITHUB_WORKSPACE"
          npx tauri signer sign "$image"
          cd "$(mktemp -d)"
          "$image" --appimage-extract >/dev/null
          if find squashfs-root -name 'libwayland*.so*' | grep -q .; then
            echo "::error::The repacked AppImage still bundles libwayland"
            find squashfs-root -name 'libwayland*.so*'
            exit 1
          fi

      - name: Update the draft with the repacked AppImage
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage | head -1)
          sig="${image}.sig"
          pending=1
          for _ in $(seq 1 40); do
            pending=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=20" \
              --jq '[.jobs[] | select(.name != "Linux" and .status != "completed")] | length')
            echo "other jobs still running: ${pending}"
            if [ "$pending" = "0" ]; then
              break
            fi
            sleep 30
          done
          if [ "$pending" != "0" ]; then
            echo "::error::Other release jobs did not finish before the AppImage was swapped"
            exit 1
          fi
          work=$(mktemp -d)
          gh release download "${GITHUB_REF_NAME}" -p latest.json -D "$work"
          SIG_FILE="$sig" python3 - "$work/latest.json" <<'PY'
          import json, os, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          data = json.loads(path.read_text())
          signature = pathlib.Path(os.environ["SIG_FILE"]).read_text()
          for key in ("linux-x86_64", "linux-x86_64-appimage"):
              data["platforms"][key]["signature"] = signature
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY
          gh release upload "${GITHUB_REF_NAME}" "$image" "$sig" "$work/latest.json" --clobber

      - name: Keep the installers
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: cellpresenter-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
