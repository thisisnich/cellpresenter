[package]
name = "cellpresenter"
version = "1.1.2"
description = "CellPresenter desktop — local-first worship lyrics presentation"
license = "AGPL-3.0-or-later"
repository = "https://github.com/thisisnich/cellpresenter"
edition = "2021"

[lib]
name = "cellpresenter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "rt", "fs", "time", "macros"] }
axum = { version = "0.8", features = ["ws"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
uuid = { version = "1.27.0", features = ["v4", "v7", "serde"] }
ts-rs = "12.0.1"
if-addrs = "0.15.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.11.0"
# Song search: fetches chord sheets and lyrics with the system's own TLS.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "http2", "query"] }
# Opens Ultimate Guitar's search in the system browser.
open = "5"
# The bundled Bibles are gzipped.
flate2 = "1.1"
# Checks GitHub for a newer release and installs it (signed updates).
tauri-plugin-updater = "=2.13.0"
# Serves media files with Range support, which video players need.
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5.3", features = ["util"] }
# Reads video uploads as a stream, to disk, instead of into memory.
futures-util = "0.3"
# Backups are zip files.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }

# Image decoding and resizing is ~20x slower unoptimised; optimise just those
# crates in dev builds so uploads stay quick under `tauri dev`.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3

[target.'cfg(target_os = "linux")'.dependencies]
# The Display window goes fullscreen on a chosen monitor through GTK, which
# also works on Wayland. Same version Tauri uses.
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# Sets the Dock icon to the console's colour palette. Same versions Tauri uses.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
