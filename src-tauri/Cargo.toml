[package]
name = "cellpresenter"
version = "0.1.0"
description = "CellPresenter desktop — local-first worship lyrics presentation"
edition = "2021"

[lib]
name = "cellpresenter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync"] }
axum = { version = "0.8", features = ["ws"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
uuid = { version = "1.27.0", features = ["v4", "v7", "serde"] }
ts-rs = "12.0.1"
if-addrs = "0.15.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
